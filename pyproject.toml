[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-aso"
version = "0.1.0"
description = "Fixed-parameter Shift-ASO reference replays"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.13,<1.14",
    "numba>=0.60,<0.61",
    "spikeinterface==0.103.2",
]

[tool.setuptools.packages.find]
include = ["shift_aso*"]

[tool.setuptools.package-data]
"shift_aso.quiroga" = ["*.cpp"]

"shift_aso.neuropixels" = ["*.json"]
