name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests shift_aso/mearec/software/tests shift_aso/mearec/generation/test_generation.py shift_aso/neuropixels/datasets/tests -q
